<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Grading Robot</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<style>
		body {
		background-image: url('https://upload.wikimedia.org/wikipedia/commons/8/8e/Staples_High_School%2C_Westport%2C_CT.jpg');
			background-repeat: no-repeat;
			background-size: cover;
			background-attachment: fixed; 
		}
		#forcolor {
			background-color: white;
			width: 1000px;
			box-shadow:2px 2px 2px rgba(0,0,0, 0.8); 
			margin: auto;
			padding: 15px;
		}
	</style>
</head>
<body>
	<br><br> 
	<div id="forcolor"> 
	<center>
	<h1 style="font-weight: bold; color: pink; font-family: New Courier;"> Computing YOUR Grades! A Score Analyzer to Crush Your Dreams </h1>
		<details ontoggle="message1()">
			<summary>
				<u>CLICK HERE</u>
				<br>
					<i id="message"></i>
				</summary>
			</details>
	</div>
</center>
<center> 
	<br> <br> 
	<div id="subjects">
	<img src="1.jpg" alt="English Image">
		<br> <br> 
		<div id="text1" class="col-md-5">
		<input type="number" class="form-control" id="Engscore" min="0" max="100" placeholder="Input Grade">
		</div>
		<br> <br> 
	<img src="2.jpg" alt="SocialStudies Image">
		<br> <br> 
		<div id="text1" class="col-md-5">
		<input type="number" class="form-control" id="Socialscore" min="0" max="100" placeholder="Input Grade">
		</div>
		<br> <br> 
	<img src="3.jpg" alt="Math Image">
		<br> <br> 
		<div id="text1" class="col-md-5">
		<input type="number" class="form-control" id="Mathscore" min="0" max="100" placeholder="Input Grade">
		</div>
	<br> <br> 
	<button type="Submit" class="btn btn-warning" onclick="theratings()">Show Me</button>
	<br> <br> 
		<kbd id="theratings">Show Here</kbd>

	</div>
</center>
<br> <br> 
<script> 
	// first function is for the click1 thing
		function message1(){
		document.getElementById("message").innerHTML = "This is an assistant to your grade troubles. Scared that you won't make the cut to pass? Calculate your grade for the major subjects and adjust yourself in school accordingly!";
	}
	    function theratings() {
        var Eng = document.getElementById("Engscore").value;
        var Social = document.getElementById("Socialscore").value;
        var Maths = document.getElementById("Mathscore").value;

        if (!Eng || !Social || !Maths) {
            alert("Please enter all grades.");
            return;
        }

        var average = (+Eng + + Social +  + Maths) / 3;
        var rating = "";

        switch (true) {
            case (average >= 94):
                rating = "Excellent!";
                break;
            case (average >= 87):
                rating = "Above Satisfactory!";
                break;
            case (average >= 80):
                rating = "Satisfactory!";
                break;
            case (average >= 75):
                rating = "Needs Improvement..";
                break;
            case (average >= 70):
                rating = "Poor...";
                break;
            default:
                rating = "Failing.";
        }

        document.getElementById("theratings").innerHTML = "Your average is " + average.toFixed(2) + " - " + rating;
        window.alert("Successfully submitted! Check bottom for answer.").innerHTML; 
    }
</script>
</body>
</html>
